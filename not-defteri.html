<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Defter — Notlar, Günlük, Bağlantılar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C12;
    --bg-elev: #12151E;
    --surface: #171B27;
    --surface-2: #1E2331;
    --border: #262C3D;
    --text: #E7E9F0;
    --muted: #8A90A6;
    --muted-2: #5C6178;
    --accent: #8B7CFF;
    --accent-soft: rgba(139,124,255,0.14);
    --accent-2: #33E0C7;
    --accent-2-soft: rgba(51,224,199,0.14);
    --danger: #FF5D7A;
    --danger-soft: rgba(255,93,122,0.14);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(1200px 800px at 85% -10%, #171c2c 0%, var(--bg) 45%) fixed;
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3,.brand,.section-label,.fab,.btn,.type-name{font-family:'Space Grotesk', 'Inter', sans-serif;}
  ::selection{ background: var(--accent-soft); }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea{ font-family:inherit; }

  .app{
    display:grid;
    grid-template-columns: 320px 1fr;
    height:100vh;
    width:100vw;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background: var(--bg-elev);
    border-right:1px solid var(--border);
    padding:24px 20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:20px;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .brand .dot{
    width:8px;height:8px;border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display:inline-block;
  }

  .cal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .cal-month{ font-weight:600; font-size:15px; text-transform:capitalize; }
  .cal-nav{ display:flex; gap:4px; }
  .icon-btn{
    width:28px; height:28px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }
  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:12px;
  }
  .cal-dow{ text-align:center; color:var(--muted-2); padding-bottom:6px; font-weight:600; }
  .cal-day{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; color:var(--muted); position:relative; transition:.12s; font-weight:500;
  }
  .cal-day.pad{ visibility:hidden; }
  .cal-day:not(.pad):hover{ background:var(--surface-2); color:var(--text); }
  .cal-day.today{ color:var(--accent-2); font-weight:700; }
  .cal-day.selected{ background:var(--accent); color:#0A0C12; font-weight:700; }
  .cal-day .mark{
    width:4px; height:4px; border-radius:50%; background:var(--accent-2); position:absolute; bottom:4px;
  }
  .cal-day.selected .mark{ background:#0A0C12; }
  .cal-clear{
    margin-top:10px; font-size:12px; color:var(--muted); background:none; border:none; text-decoration:underline;
    text-underline-offset:3px;
  }
  .cal-clear:hover{ color:var(--text); }

  .side-section{ display:flex; flex-direction:column; gap:10px; }
  .section-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted-2); font-weight:600; }
  .upcoming-list{ display:flex; flex-direction:column; gap:8px; }
  .upcoming-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; background:var(--surface);
    border:1px solid var(--border); font-size:12.5px; cursor:pointer;
  }
  .upcoming-item:hover{ border-color:var(--accent-2); }
  .upcoming-item .t{ color:var(--accent-2); font-weight:600; font-variant-numeric:tabular-nums; }
  .upcoming-item .n{ color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty-hint{ font-size:12.5px; color:var(--muted-2); padding:4px 2px; line-height:1.5; }

  .filters{ display:flex; flex-direction:column; gap:4px; margin-top:auto; padding-top:10px; border-top:1px solid var(--border); }
  .filter-btn{
    display:flex; align-items:center; justify-content:space-between; background:none; border:none; color:var(--muted);
    padding:8px 10px; border-radius:9px; font-size:13.5px; font-weight:500; text-align:left;
  }
  .filter-btn:hover{ background:var(--surface); color:var(--text); }
  .filter-btn.active{ background:var(--accent-soft); color:var(--accent); }
  .filter-btn .count{ font-size:11px; color:var(--muted-2); }
  .filter-btn.active .count{ color:var(--accent); }

  /* ---------- MAIN ---------- */
  .main{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .topbar{
    display:flex; align-items:center; gap:16px; padding:22px 32px 16px;
    border-bottom:1px solid var(--border);
  }
  .page-title{ font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  .page-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .search-wrap{ margin-left:auto; position:relative; width:260px; }
  .search-wrap input{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:9px 12px 9px 34px; border-radius:10px; font-size:13.5px; outline:none;
  }
  .search-wrap input:focus{ border-color:var(--accent); }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5; }
  .menu-toggle{ display:none; }

  .content{ flex:1; overflow-y:auto; padding:22px 32px 120px; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px,1fr)); gap:14px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:16px; display:flex; flex-direction:column; gap:10px; transition:.15s; position:relative;
  }
  .card:hover{ border-color:#333a52; transform:translateY(-1px); }
  .card-top{ display:flex; align-items:flex-start; gap:10px; }
  .type-chip{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:3px 8px; border-radius:6px; white-space:nowrap;
  }
  .type-chip.note{ background:var(--accent-soft); color:var(--accent); }
  .type-chip.log{ background:rgba(255,190,107,0.14); color:#FFBE6B; }
  .type-chip.link{ background:var(--accent-2-soft); color:var(--accent-2); }
  .type-chip.image{ background:rgba(255,140,214,0.14); color:#FF8CD6; }
  .type-chip.todo{ background:rgba(120,170,255,0.14); color:#78AAFF; }
  .card-title{ font-weight:600; font-size:14.5px; flex:1; word-break:break-word; }
  .card-title.done{ text-decoration:line-through; color:var(--muted-2); }
  .card-body{ font-size:13px; color:var(--muted); line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .card-body a{ color:var(--accent-2); }
  .card-img{ width:100%; border-radius:10px; max-height:160px; object-fit:cover; display:block; }
  .card-meta{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted-2); margin-top:auto; }
  .alarm-tag{ display:flex; align-items:center; gap:4px; color:var(--accent-2); }
  .card-actions{ display:flex; gap:6px; position:absolute; top:12px; right:12px; opacity:0; transition:.15s; }
  .card:hover .card-actions{ opacity:1; }
  .card-actions button{
    width:24px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--muted); display:flex; align-items:center; justify-content:center;
  }
  .card-actions button:hover{ color:var(--text); border-color:var(--accent); }
  .todo-check{
    width:19px; height:19px; border-radius:6px; border:1.5px solid var(--muted-2); flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center; background:none;
  }
  .todo-check.checked{ background:var(--accent-2); border-color:var(--accent-2); color:#0A0C12; }

  /* checklist builder (inside add/edit modal) */
  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task-row{ display:flex; align-items:center; gap:8px; }
  .task-check{ width:20px; height:20px; border-radius:6px; border:1.5px solid var(--muted-2); flex-shrink:0; display:flex; align-items:center; justify-content:center; background:none; color:#0A0C12; font-size:12px; }
  .task-check.checked{ background:var(--accent-2); border-color:var(--accent-2); }
  .task-text-input{ flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:8px; font-size:13px; outline:none; }
  .task-text-input:focus{ border-color:var(--accent); }
  .task-remove{ width:24px; height:24px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2); color:var(--muted); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .task-remove:hover{ color:var(--danger); border-color:var(--danger); }
  .add-task-btn{ display:flex; align-items:center; justify-content:center; gap:6px; background:none; border:1px dashed var(--border); color:var(--muted); padding:9px 12px; border-radius:10px; font-size:13px; width:100%; }
  .add-task-btn:hover{ color:var(--accent); border-color:var(--accent); }

  /* checklist display (on cards) */
  .todo-progress-bar{ height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
  .todo-progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .todo-count{ font-size:11.5px; color:var(--muted-2); }
  .task-item-list{ display:flex; flex-direction:column; gap:6px; }
  .task-item-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
  .task-item-row.done{ color:var(--muted-2); text-decoration:line-through; }
  .task-item-check{ width:17px; height:17px; border-radius:5px; border:1.5px solid var(--muted-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:none; font-size:11px; color:#0A0C12; }
  .task-item-check.checked{ background:var(--accent-2); border-color:var(--accent-2); }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:80px 20px; color:var(--muted); gap:8px;
  }
  .empty-state .big{ font-size:17px; font-weight:600; color:var(--text); }
  .empty-state .small{ font-size:13px; color:var(--muted); max-width:320px; }

  /* ---------- FAB ---------- */
  .fab-wrap{ position:fixed; bottom:30px; right:36px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; z-index:40; }
  .fab-menu{
    display:flex; flex-direction:column; gap:8px; opacity:0; pointer-events:none; transform:translateY(8px);
    transition:.16s;
  }
  .fab-menu.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .fab-option{
    display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    padding:9px 14px 9px 10px; border-radius:12px; box-shadow:var(--shadow); color:var(--text); font-size:13.5px; font-weight:500;
  }
  .fab-option:hover{ border-color:var(--accent); }
  .fab-option .ic{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .fab{
    width:58px; height:58px; border-radius:50%; border:none; color:#0A0C12; font-size:28px; font-weight:400;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 10px 28px rgba(139,124,255,0.35);
    display:flex; align-items:center; justify-content:center; transition:.2s;
  }
  .fab:hover{ transform:scale(1.06); }
  .fab.open{ transform:rotate(45deg); }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,7,12,0.6); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; z-index:60; opacity:0; pointer-events:none; transition:.15s;
    padding:20px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius-l);
    width:100%; max-width:420px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);
    transform:translateY(10px) scale(.98); transition:.18s;
  }
  .overlay.open .modal{ transform:translateY(0) scale(1); }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px 6px; }
  .modal-head h3{ font-size:16px; font-weight:700; }
  .modal-close{ background:none; border:none; color:var(--muted); font-size:20px; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .modal-body{ padding:14px 20px 22px; display:flex; flex-direction:column; gap:14px; }

  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; }
  .field input[type=text], .field input[type=url], .field textarea, .field input[type=date], .field input[type=time]{
    width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:13.5px; outline:none;
  }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:90px; line-height:1.5; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .switch-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:11px 13px; }
  .switch-row .label{ font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .switch{ width:38px; height:22px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); position:relative; flex-shrink:0; transition:.15s; }
  .switch::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--muted); top:2px; left:2px; transition:.15s; }
  .switch.on{ background:var(--accent-2-soft); border-color:var(--accent-2); }
  .switch.on::after{ transform:translateX(16px); background:var(--accent-2); }

  .type-name{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; }

  .image-drop{
    border:1.5px dashed var(--border); border-radius:12px; padding:18px; text-align:center; cursor:pointer; color:var(--muted); font-size:13px;
  }
  .image-drop:hover{ border-color:var(--accent); color:var(--text); }
  .image-preview{ width:100%; border-radius:10px; max-height:180px; object-fit:cover; display:none; }

  .btn{ padding:11px 16px; border-radius:11px; border:none; font-weight:600; font-size:13.5px; }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#0A0C12; width:100%; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-danger-outline{ background:none; border:1px solid var(--danger); color:var(--danger); }

  /* Alarm ring modal */
  .ring-modal .modal{ max-width:340px; text-align:center; }
  .ring-icon{
    width:64px; height:64px; border-radius:50%; background:var(--accent-2-soft); color:var(--accent-2);
    display:flex; align-items:center; justify-content:center; margin:20px auto 6px; animation:pulse 1.1s infinite;
  }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(51,224,199,0.35);} 50%{ box-shadow:0 0 0 14px rgba(51,224,199,0);} }
  .ring-title{ font-size:17px; font-weight:700; margin-bottom:4px; padding:0 20px; }
  .ring-sub{ font-size:13px; color:var(--muted); margin-bottom:18px; padding:0 20px; }
  .ring-actions{ display:flex; gap:10px; padding:0 20px 22px; }
  .ring-actions .btn{ flex:1; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2);
    border:1px solid var(--border); padding:11px 18px; border-radius:11px; font-size:13px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:.2s; z-index:80;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- MOBILE ---------- */
  @media (max-width: 820px){
    .app{ grid-template-columns:1fr; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; width:82%; max-width:320px; z-index:70;
      transform:translateX(-105%); transition:.2s; box-shadow:var(--shadow);
    }
    .sidebar.open{ transform:translateX(0); }
    .menu-toggle{
      display:flex; width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
      align-items:center; justify-content:center; color:var(--text); flex-shrink:0;
    }
    .topbar{ padding:16px 16px 12px; gap:10px; }
    .page-title{ font-size:18px; }
    .search-wrap{ width:auto; flex:1; margin-left:0; }
    .content{ padding:14px 16px 120px; }
    .grid{ grid-template-columns:1fr; }
    .fab-wrap{ right:20px; bottom:22px; }
    .sidebar-scrim{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:65;
    }
    .sidebar-scrim.open{ display:block; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span>Defter</div>

    <div class="side-section">
      <div class="cal-head">
        <div class="cal-month" id="calMonth"></div>
        <div class="cal-nav">
          <button class="icon-btn" id="prevMonth">‹</button>
          <button class="icon-btn" id="nextMonth">›</button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <button class="cal-clear" id="calClear" style="display:none;">Tarih filtresini temizle</button>
    </div>

    <div class="side-section">
      <div class="section-label">Yaklaşan Alarmlar</div>
      <div class="upcoming-list" id="upcomingList"></div>
    </div>

    <div class="filters" id="filterList"></div>
  </aside>

  <div class="sidebar-scrim" id="scrim"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <div class="page-title" id="pageTitle">Tümü</div>
        <div class="page-sub" id="pageSub">Tüm kayıtların</div>
      </div>
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Ara...">
      </div>
    </div>

    <div class="content">
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="big">Henüz bir şey yok</div>
        <div class="small">Sağ alttaki + butonuna dokunarak ilk notunu, günlüğünü, bağlantını ya da yapılacağını ekle.</div>
      </div>
    </div>
  </main>
</div>

<!-- FAB -->
<div class="fab-wrap">
  <div class="fab-menu" id="fabMenu">
    <button class="fab-option" data-type="todo"><span class="ic" style="background:rgba(120,170,255,0.14);color:#78AAFF;">✓</span>Yapılacaklar Listesi</button>
    <button class="fab-option" data-type="image"><span class="ic" style="background:rgba(255,140,214,0.14);color:#FF8CD6;">🖼</span>Resim + Yazı</button>
    <button class="fab-option" data-type="link"><span class="ic" style="background:var(--accent-2-soft);color:var(--accent-2);">🔗</span>Bağlantı</button>
    <button class="fab-option" data-type="log"><span class="ic" style="background:rgba(255,190,107,0.14);color:#FFBE6B;">📔</span>Günlük Kaydı</button>
    <button class="fab-option" data-type="note"><span class="ic" style="background:var(--accent-soft);color:var(--accent);">✎</span>Hızlı Not</button>
  </div>
  <button class="fab" id="fabBtn">+</button>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="type-name" id="modalTypeName"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ALARM RING MODAL -->
<div class="overlay ring-modal" id="ringOverlay">
  <div class="modal">
    <div class="ring-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>
    <div class="ring-title" id="ringTitle">Hatırlatma</div>
    <div class="ring-sub" id="ringSub"></div>
    <div class="ring-actions">
      <button class="btn btn-danger-outline" id="ringDismiss">Kapat</button>
      <button class="btn btn-primary" id="ringSnooze">10 dk Ertele</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- STATE ---------------- */
  const STORAGE_KEY = "defter_items_v1";
  const FIRED_KEY = "defter_fired_v1";
  let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let fired = JSON.parse(localStorage.getItem(FIRED_KEY) || "[]");

  // migrate any old-style todo items (single title + done flag) into a checklist
  let migrated = false;
  items.forEach(it=>{
    if(it.type === "todo" && !Array.isArray(it.tasks)){
      it.tasks = it.title ? [{ id: uid(), text: it.title, done: !!it.done }] : [];
      it.title = "Yapılacaklar Listesi";
      migrated = true;
    }
  });
  if(migrated) localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  let currentFilter = "all";
  let selectedDate = null; // "YYYY-MM-DD"
  let searchTerm = "";
  let calCursor = new Date();
  let editingId = null;
  let pendingImageData = null;
  let ringingItem = null;

  const TYPE_META = {
    note:  { label:"Hızlı Not",      icon:"✎", cls:"note" },
    log:   { label:"Günlük Kaydı",   icon:"📔", cls:"log" },
    link:  { label:"Bağlantı",       icon:"🔗", cls:"link" },
    image: { label:"Resim + Yazı",   icon:"🖼", cls:"image" },
    todo:  { label:"Yapılacaklar Listesi", icon:"✓", cls:"todo" }
  };
  const FILTERS = [
    { key:"all",  label:"Tüm Kayıtlar" },
    { key:"note", label:"Hızlı Notlar" },
    { key:"log",  label:"Günlük Kayıtları" },
    { key:"link", label:"Bağlantılar" },
    { key:"image",label:"Resimler" },
    { key:"todo", label:"Yapılacaklar" }
  ];

  const DOW = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
  const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
  function saveFired(){ localStorage.setItem(FIRED_KEY, JSON.stringify(fired)); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return n.toString().padStart(2,"0"); }
  function toISODate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function linkify(text){
    const esc = escapeHtml(text);
    return esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  /* ---------------- CALENDAR ---------------- */
  function renderCalendar(){
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    document.getElementById("calMonth").textContent = MONTHS[m] + " " + y;
    const grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    DOW.forEach(d=>{
      const el = document.createElement("div");
      el.className = "cal-dow"; el.textContent = d;
      grid.appendChild(el);
    });
    const firstDay = new Date(y, m, 1);
    let startOffset = firstDay.getDay() - 1; // Monday-first
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const todayISO = toISODate(new Date());

    const datesWithItems = new Set(items.filter(i=>i.date).map(i=>i.date));

    for(let i=0;i<startOffset;i++){
      const el = document.createElement("div");
      el.className = "cal-day pad";
      grid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const iso = y+"-"+pad(m+1)+"-"+pad(d);
      const el = document.createElement("div");
      el.className = "cal-day";
      if(iso === todayISO) el.classList.add("today");
      if(iso === selectedDate) el.classList.add("selected");
      el.innerHTML = "<span>"+d+"</span>";
      if(datesWithItems.has(iso)){
        const mark = document.createElement("span");
        mark.className = "mark";
        el.appendChild(mark);
      }
      el.addEventListener("click", ()=>{
        selectedDate = (selectedDate === iso) ? null : iso;
        renderCalendar();
        renderGrid();
      });
      grid.appendChild(el);
    }
    document.getElementById("calClear").style.display = selectedDate ? "block" : "none";
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    calCursor.setMonth(calCursor.getMonth()-1); renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    calCursor.setMonth(calCursor.getMonth()+1); renderCalendar();
  });
  document.getElementById("calClear").addEventListener("click", ()=>{
    selectedDate = null; renderCalendar(); renderGrid();
  });

  /* ---------------- FILTERS ---------------- */
  function renderFilters(){
    const wrap = document.getElementById("filterList");
    wrap.innerHTML = "";
    FILTERS.forEach(f=>{
      const count = f.key==="all" ? items.length : items.filter(i=>i.type===f.key).length;
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (currentFilter===f.key ? " active" : "");
      btn.innerHTML = '<span>'+f.label+'</span><span class="count">'+count+'</span>';
      btn.addEventListener("click", ()=>{ currentFilter = f.key; renderFilters(); renderGrid(); updateHeader(); });
      wrap.appendChild(btn);
    });
  }

  function updateHeader(){
    const f = FILTERS.find(x=>x.key===currentFilter);
    document.getElementById("pageTitle").textContent = f.label;
    let sub = items.length + " kayıt";
    if(selectedDate) sub += " · " + selectedDate;
    document.getElementById("pageSub").textContent = sub;
  }

  /* ---------------- UPCOMING ALARMS ---------------- */
  function renderUpcoming(){
    const wrap = document.getElementById("upcomingList");
    const now = new Date();
    const list = items.filter(i=>i.alarm && i.date && i.time)
      .map(i=>({ item:i, dt:new Date(i.date+"T"+i.time) }))
      .filter(x=>x.dt >= new Date(now.getTime()-60000))
      .sort((a,b)=>a.dt-b.dt)
      .slice(0,5);
    if(list.length===0){
      wrap.innerHTML = '<div class="empty-hint">Yaklaşan alarm yok. Not eklerken alarmı açabilirsin.</div>';
      return;
    }
    wrap.innerHTML = "";
    list.forEach(({item,dt})=>{
      const el = document.createElement("div");
      el.className = "upcoming-item";
      el.innerHTML = '<span class="t">'+pad(dt.getHours())+':'+pad(dt.getMinutes())+'</span><span class="n">'+escapeHtml(item.title||"(başlıksız)")+'</span>';
      el.addEventListener("click", ()=>openEdit(item.id));
      wrap.appendChild(el);
    });
  }

  /* ---------------- GRID ---------------- */
  function renderGrid(){
    let list = items.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(currentFilter !== "all") list = list.filter(i=>i.type===currentFilter);
    if(selectedDate) list = list.filter(i=>i.date===selectedDate);
    if(searchTerm){
      const q = searchTerm.toLowerCase();
      list = list.filter(i => (i.title||"").toLowerCase().includes(q) || (i.content||"").toLowerCase().includes(q) || (i.url||"").toLowerCase().includes(q));
    }
    const grid = document.getElementById("grid");
    const empty = document.getElementById("emptyState");
    grid.innerHTML = "";
    if(list.length===0){ empty.style.display="flex"; renderUpcoming(); renderCalendar(); return; }
    empty.style.display = "none";

    list.forEach(item=>{
      const meta = TYPE_META[item.type];
      const card = document.createElement("div");
      card.className = "card";

      let topHtml = '<span class="type-chip '+meta.cls+'">'+meta.label+'</span>';
      let titleHtml = '';
      if(item.type === "todo"){
        card.innerHTML += ''; // placeholder, built below
      } else {
        titleHtml = '<div class="card-title">'+escapeHtml(item.title||"(başlıksız)")+'</div>';
      }

      let bodyHtml = "";
      if(item.type === "image" && item.image){
        bodyHtml += '<img class="card-img" src="'+item.image+'">';
      }
      if(item.type === "link"){
        bodyHtml += '<div class="card-body">'+linkify(item.url||"")+'</div>';
        if(item.content) bodyHtml += '<div class="card-body">'+escapeHtml(item.content)+'</div>';
      } else if(item.content){
        bodyHtml += '<div class="card-body">'+escapeHtml(item.content)+'</div>';
      }

      let metaHtml = '<div class="card-meta">';
      if(item.date) metaHtml += '<span>'+item.date+(item.time?(" · "+item.time):"")+'</span>';
      if(item.alarm) metaHtml += '<span class="alarm-tag">⏰ Alarm</span>';
      metaHtml += '</div>';

      if(item.type === "todo"){
        card.innerHTML = topHtml;
        const t = document.createElement("div");
        t.className = "card-title";
        t.textContent = item.title || "Yapılacaklar Listesi";
        card.appendChild(t);

        const tasks = item.tasks || [];
        if(tasks.length){
          const doneCount = tasks.filter(x=>x.done).length;
          const progWrap = document.createElement("div");
          progWrap.innerHTML = '<div class="todo-progress-bar"><div class="todo-progress-fill" style="width:'+Math.round((doneCount/tasks.length)*100)+'%;"></div></div><div class="todo-count">'+doneCount+' / '+tasks.length+' tamamlandı</div>';
          card.appendChild(progWrap);

          const list = document.createElement("div");
          list.className = "task-item-list";
          tasks.forEach(task=>{
            const row = document.createElement("div");
            row.className = "task-item-row" + (task.done ? " done" : "");
            const check = document.createElement("button");
            check.className = "task-item-check" + (task.done ? " checked" : "");
            check.innerHTML = task.done ? "✓" : "";
            check.addEventListener("click", (e)=>{
              e.stopPropagation();
              task.done = !task.done;
              save(); renderGrid();
            });
            const label = document.createElement("span");
            label.style.flex = "1";
            label.textContent = task.text;
            row.appendChild(check); row.appendChild(label);
            list.appendChild(row);
          });
          card.appendChild(list);
        } else {
          const hint = document.createElement("div");
          hint.className = "card-body";
          hint.textContent = "Madde yok — düzenlemek için kalem simgesine dokun.";
          card.appendChild(hint);
        }
      } else {
        card.innerHTML = topHtml + titleHtml;
      }

      if(bodyHtml){
        const bodyWrap = document.createElement("div");
        bodyWrap.innerHTML = bodyHtml;
        while(bodyWrap.firstChild) card.appendChild(bodyWrap.firstChild);
      }
      const metaWrap = document.createElement("div");
      metaWrap.innerHTML = metaHtml;
      card.appendChild(metaWrap.firstChild);

      const actions = document.createElement("div");
      actions.className = "card-actions";
      actions.innerHTML = '<button data-act="edit">✎</button><button data-act="del">🗑</button>';
      actions.querySelector('[data-act="edit"]').addEventListener("click",(e)=>{ e.stopPropagation(); openEdit(item.id); });
      actions.querySelector('[data-act="del"]').addEventListener("click",(e)=>{
        e.stopPropagation();
        if(confirm("Bu kaydı silmek istediğine emin misin?")){
          items = items.filter(i=>i.id!==item.id);
          save(); renderAll();
        }
      });
      card.appendChild(actions);

      grid.appendChild(card);
    });

    renderUpcoming();
    renderCalendar();
  }

  function renderAll(){
    renderCalendar();
    renderFilters();
    renderGrid();
    updateHeader();
  }

  /* ---------------- SEARCH ---------------- */
  document.getElementById("searchInput").addEventListener("input", (e)=>{
    searchTerm = e.target.value.trim();
    renderGrid();
  });

  /* ---------------- MOBILE SIDEBAR ---------------- */
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  document.getElementById("menuToggle").addEventListener("click", ()=>{
    sidebar.classList.add("open"); scrim.classList.add("open");
  });
  scrim.addEventListener("click", ()=>{
    sidebar.classList.remove("open"); scrim.classList.remove("open");
  });

  /* ---------------- FAB ---------------- */
  const fabBtn = document.getElementById("fabBtn");
  const fabMenu = document.getElementById("fabMenu");
  fabBtn.addEventListener("click", ()=>{
    fabBtn.classList.toggle("open");
    fabMenu.classList.toggle("open");
  });
  document.querySelectorAll(".fab-option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      fabBtn.classList.remove("open"); fabMenu.classList.remove("open");
      openAdd(btn.getAttribute("data-type"));
    });
  });

  /* ---------------- MODAL: ADD / EDIT ---------------- */
  const overlay = document.getElementById("overlay");
  const modalBody = document.getElementById("modalBody");
  const modalTypeName = document.getElementById("modalTypeName");

  function closeModal(){
    overlay.classList.remove("open");
    editingId = null; pendingImageData = null;
  }
  document.getElementById("modalClose").addEventListener("click", closeModal);
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeModal(); });

  function fieldTemplate(type, item){
    item = item || {};
    let html = '';
    if(type === "todo"){
      html += '<div class="field"><label>Liste adı (opsiyonel)</label><input type="text" id="f-title" placeholder="Örn. Market Listesi" value="'+escapeHtml(item.title||"")+'"></div>';
    } else {
      html += '<div class="field"><label>Başlık</label><input type="text" id="f-title" placeholder="Kısa bir başlık..." value="'+escapeHtml(item.title||"")+'"></div>';
    }

    if(type === "link"){
      html += '<div class="field"><label>Bağlantı (URL)</label><input type="url" id="f-url" placeholder="https://" value="'+escapeHtml(item.url||"")+'"></div>';
      html += '<div class="field"><label>Not (opsiyonel)</label><textarea id="f-content" placeholder="Bağlantı hakkında not...">'+escapeHtml(item.content||"")+'</textarea></div>';
    } else if(type === "image"){
      html += '<div class="field"><label>Resim</label><div class="image-drop" id="imageDrop">Resim seçmek için dokun</div><input type="file" id="f-image" accept="image/*" style="display:none;"><img id="imgPreview" class="image-preview"></div>';
      html += '<div class="field"><label>Açıklama</label><textarea id="f-content" placeholder="Resim hakkında yaz...">'+escapeHtml(item.content||"")+'</textarea></div>';
    } else if(type === "todo"){
      html += '<div class="field"><label>Maddeler</label><div class="task-list" id="taskList"></div><button type="button" class="add-task-btn" id="addTaskBtn">+ Madde ekle</button></div>';
    } else {
      html += '<div class="field"><label>'+(type==="log"?"Günlük":"Not")+'</label><textarea id="f-content" placeholder="'+(type==="log"?"Bugün neler oldu?":"Aklındakini yaz...")+'" style="min-height:120px;">'+escapeHtml(item.content||"")+'</textarea></div>';
    }

    html += '<div class="row2">';
    html += '<div class="field"><label>Tarih</label><input type="date" id="f-date" value="'+(item.date||"")+'"></div>';
    html += '<div class="field"><label>Saat</label><input type="time" id="f-time" value="'+(item.time||"")+'"></div>';
    html += '</div>';

    html += '<div class="switch-row"><div class="label">⏰ Belirlenen zamanda alarm çal</div><div class="switch" id="alarmSwitch"></div></div>';

    html += '<button class="btn btn-primary" id="saveBtn">Kaydet</button>';
    if(item.id) html += '<button class="btn btn-danger-outline" id="deleteBtn" style="width:100%;">Kaydı Sil</button>';
    return html;
  }

  function openAdd(type){
    editingId = null; pendingImageData = null;
    const meta = TYPE_META[type];
    modalTypeName.innerHTML = meta.icon + " " + meta.label;
    modalBody.innerHTML = fieldTemplate(type, { date: selectedDate || "" });
    bindModalEvents(type, null);
    overlay.classList.add("open");
  }

  function openEdit(id){
    const item = items.find(i=>i.id===id);
    if(!item) return;
    editingId = id; pendingImageData = item.image || null;
    const meta = TYPE_META[item.type];
    modalTypeName.innerHTML = meta.icon + " " + meta.label;
    modalBody.innerHTML = fieldTemplate(item.type, item);
    bindModalEvents(item.type, item);
    overlay.classList.add("open");
  }

  function bindModalEvents(type, item){
    const alarmSwitch = document.getElementById("alarmSwitch");
    let alarmOn = item ? !!item.alarm : false;
    if(alarmOn) alarmSwitch.classList.add("on");
    alarmSwitch.addEventListener("click", ()=>{
      alarmOn = !alarmOn;
      alarmSwitch.classList.toggle("on", alarmOn);
    });

    let taskDraft = [];
    if(type === "todo"){
      taskDraft = (item && Array.isArray(item.tasks)) ? item.tasks.map(t=>({ id:t.id||uid(), text:t.text||"", done:!!t.done })) : [];
      const taskListEl = document.getElementById("taskList");
      const addTaskBtn = document.getElementById("addTaskBtn");

      function renderTaskRows(focusLastEmpty){
        taskListEl.innerHTML = "";
        taskDraft.forEach((task, idx)=>{
          const row = document.createElement("div");
          row.className = "task-row";

          const check = document.createElement("button");
          check.type = "button";
          check.className = "task-check" + (task.done ? " checked" : "");
          check.innerHTML = task.done ? "✓" : "";
          check.addEventListener("click", ()=>{
            task.done = !task.done;
            check.classList.toggle("checked", task.done);
            check.innerHTML = task.done ? "✓" : "";
          });

          const input = document.createElement("input");
          input.type = "text";
          input.className = "task-text-input";
          input.placeholder = "Madde yaz...";
          input.value = task.text;
          input.addEventListener("input", ()=>{ task.text = input.value; });
          input.addEventListener("keydown", (e)=>{
            if(e.key === "Enter"){ e.preventDefault(); addTask(); }
          });

          const rm = document.createElement("button");
          rm.type = "button";
          rm.className = "task-remove";
          rm.innerHTML = "✕";
          rm.addEventListener("click", ()=>{
            taskDraft.splice(idx,1);
            renderTaskRows();
          });

          row.appendChild(check); row.appendChild(input); row.appendChild(rm);
          taskListEl.appendChild(row);
          if(focusLastEmpty && idx === taskDraft.length-1) input.focus();
        });
        if(taskDraft.length === 0){
          const hint = document.createElement("div");
          hint.className = "empty-hint";
          hint.textContent = "Henüz madde yok — aşağıdan ekle.";
          taskListEl.appendChild(hint);
        }
      }
      function addTask(){
        taskDraft.push({ id:uid(), text:"", done:false });
        renderTaskRows(true);
      }
      addTaskBtn.addEventListener("click", addTask);
      renderTaskRows();
      if(taskDraft.length === 0) addTask();
    }

    if(type === "image"){
      const drop = document.getElementById("imageDrop");
      const fileInput = document.getElementById("f-image");
      const preview = document.getElementById("imgPreview");
      if(pendingImageData){
        preview.src = pendingImageData; preview.style.display = "block";
        drop.textContent = "Resmi değiştirmek için dokun";
      }
      drop.addEventListener("click", ()=>fileInput.click());
      fileInput.addEventListener("change", ()=>{
        const file = fileInput.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e)=>{
          pendingImageData = e.target.result;
          preview.src = pendingImageData; preview.style.display = "block";
          drop.textContent = "Resmi değiştirmek için dokun";
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("saveBtn").addEventListener("click", ()=>{
      let title = document.getElementById("f-title").value.trim();
      const content = document.getElementById("f-content") ? document.getElementById("f-content").value.trim() : "";
      const url = document.getElementById("f-url") ? document.getElementById("f-url").value.trim() : "";
      const date = document.getElementById("f-date").value;
      const time = document.getElementById("f-time").value;

      let cleanTasks = null;
      if(type === "todo"){
        cleanTasks = taskDraft.map(t=>({ id:t.id||uid(), text:t.text.trim(), done:!!t.done })).filter(t=>t.text);
        if(cleanTasks.length === 0){ showToast("Lütfen en az bir madde ekle"); return; }
        if(!title) title = "Yapılacaklar Listesi";
      } else {
        if(!title && !content && !url && type!=="image"){ showToast("Lütfen bir başlık ya da içerik yaz"); return; }
      }
      if(type === "link" && !url){ showToast("Lütfen bir bağlantı gir"); return; }
      if(alarmOn && (!date || !time)){ showToast("Alarm için tarih ve saat seç"); return; }

      if(editingId){
        const it = items.find(i=>i.id===editingId);
        it.title = title; it.content = content; it.url = url; it.date = date; it.time = time; it.alarm = alarmOn;
        if(type==="image") it.image = pendingImageData;
        if(type==="todo") it.tasks = cleanTasks;
        fired = fired.filter(fid=>fid !== editingId);
        saveFired();
      } else {
        items.push({
          id: uid(), type, title, content, url, date, time, alarm: alarmOn,
          image: type==="image" ? pendingImageData : null,
          tasks: type==="todo" ? cleanTasks : undefined,
          done: false, createdAt: Date.now()
        });
      }
      save();
      closeModal();
      renderAll();
      showToast(editingId ? "Güncellendi" : "Eklendi");
      if(alarmOn) maybeRequestNotifyPermission();
    });

    const delBtn = document.getElementById("deleteBtn");
    if(delBtn){
      delBtn.addEventListener("click", ()=>{
        if(confirm("Bu kaydı silmek istediğine emin misin?")){
          items = items.filter(i=>i.id!==editingId);
          save(); closeModal(); renderAll();
          showToast("Silindi");
        }
      });
    }
  }

  /* ---------------- ALARM ENGINE ---------------- */
  function maybeRequestNotifyPermission(){
    if("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
  }

  let audioCtx = null;
  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      for(let i=0;i<3;i++){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now + i*0.45);
        gain.gain.linearRampToValueAtTime(0.25, now + i*0.45 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.45 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i*0.45); osc.stop(now + i*0.45 + 0.4);
      }
    }catch(e){}
  }

  const ringOverlay = document.getElementById("ringOverlay");
  function ring(item){
    ringingItem = item;
    document.getElementById("ringTitle").textContent = item.title || "Hatırlatma";
    document.getElementById("ringSub").textContent = (item.date||"") + (item.time?(" · "+item.time):"");
    ringOverlay.classList.add("open");
    beep();
    if("Notification" in window && Notification.permission === "granted"){
      try{ new Notification(item.title || "Hatırlatma", { body: item.content || "Defter uygulamanızdan bir hatırlatma" }); }catch(e){}
    }
  }
  document.getElementById("ringDismiss").addEventListener("click", ()=>{
    ringOverlay.classList.remove("open"); ringingItem = null;
  });
  document.getElementById("ringSnooze").addEventListener("click", ()=>{
    if(ringingItem){
      const dt = new Date(Date.now() + 10*60000);
      ringingItem.date = toISODate(dt);
      ringingItem.time = pad(dt.getHours())+":"+pad(dt.getMinutes());
      fired = fired.filter(fid=>fid!==ringingItem.id);
      save(); saveFired(); renderAll();
      showToast("10 dakika sonraya ertelendi");
    }
    ringOverlay.classList.remove("open"); ringingItem = null;
  });

  function checkAlarms(){
    if(ringOverlay.classList.contains("open")) return;
    const now = new Date();
    for(const item of items){
      if(!item.alarm || !item.date || !item.time) continue;
      if(fired.includes(item.id)) continue;
      const dt = new Date(item.date+"T"+item.time+":00");
      const diff = now - dt;
      if(diff >= 0 && diff < 60000){
        fired.push(item.id);
        saveFired();
        ring(item);
        break;
      }
    }
  }
  setInterval(checkAlarms, 15000);
  checkAlarms();

  /* ---------------- INIT ---------------- */
  renderAll();
})();
</script>
</body>
</html>
